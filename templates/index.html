<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小明天 - 马天明的AI面试助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .header-info h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header-info p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #667eea;
            color: white;
        }

        .message.assistant .message-avatar {
            background: white;
            border: 2px solid #667eea;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 15px;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .suggested-questions {
            padding: 15px 30px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .suggested-questions h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .question-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .question-tag {
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .question-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .input-area {
            padding: 15px 30px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 0;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .welcome-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .welcome-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .welcome-card p {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .info-badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .info-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }

        .clear-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Scrollbar styling */
        .chat-area::-webkit-scrollbar {
            width: 6px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .chat-area::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" style="position: relative;">
            <div class="avatar">🤖</div>
            <div class="header-info">
                <h1>小明天</h1>
                <p>马天明的AI面试助手 · 有什么想了解的尽管问我~</p>
            </div>
            <button class="clear-btn" onclick="clearChat()">🗑️ 清空对话</button>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="welcome-card">
                <h2>👋 哈喽！我是小明天</h2>
                <p>我是马天明的AI分身，对他的了解可能比他自己还深（笑）<br>
                今天我的任务就是让面试官你快速认识一个真实、立体的马天明<br>
                有任何想了解的，尽管问我！</p>
                <div class="info-badges">
                    <span class="info-badge">📚 湖南师大硕士</span>
                    <span class="info-badge">🤖 AI Agent方向</span>
                    <span class="info-badge">🏀 长沙本地人</span>
                    <span class="info-badge">💻 全栈开发</span>
                </div>
            </div>
        </div>

        <div class="suggested-questions">
            <h3>💡 不知道问什么？试试这些问题：</h3>
            <div class="question-tags">
                <button class="question-tag" onclick="askQuestion('请做个自我介绍')">请做个自我介绍</button>
                <button class="question-tag" onclick="askQuestion('说说你的项目经历')">说说你的项目经历</button>
                <button class="question-tag" onclick="askQuestion('你为什么想做AI Agent方向')">为什么想做AI Agent方向</button>
                <button class="question-tag" onclick="askQuestion('你在百度实习做了什么')">百度实习经历</button>
                <button class="question-tag" onclick="askQuestion('你的优势和不足是什么')">优势和不足</button>
                <button class="question-tag" onclick="askQuestion('说说你的技术栈')">技术栈</button>
                <button class="question-tag" onclick="askQuestion('你的职业规划是什么')">职业规划</button>
                <button class="question-tag" onclick="askQuestion('你有什么爱好')">个人爱好</button>
                <button class="question-tag" onclick="askQuestion('为什么想加入我们公司')">为什么想加入</button>
                <button class="question-tag" onclick="askQuestion('介绍一下你的科研成果')">科研成果</button>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="message-avatar" style="background: white; border: 2px solid #667eea;">🤖</div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="输入你想问的问题..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const sessionId = Date.now().toString();
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const typingIndicator = document.getElementById('typingIndicator');

        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            messageDiv.innerHTML = `
                <div class="message-avatar">${isUser ? '👤' : '🤖'}</div>
                <div class="message-content">${content}</div>
            `;
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showTyping() {
            typingIndicator.classList.add('active');
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.classList.remove('active');
        }

        function askQuestion(question) {
            userInput.value = question;
            sendMessage();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';
            showTyping();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });

                hideTyping();

                if (!response.ok) {
                    throw new Error('API请求失败');
                }

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }

                addMessage(data.response, false);
            } catch (error) {
                hideTyping();
                addMessage('抱歉，我这边出了点问题，请稍后再试~', false);
                console.error('Error:', error);
            }
        }

        async function clearChat() {
            try {
                await fetch('/api/clear', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        session_id: sessionId
                    })
                });
                
                // 清空聊天区域但保留欢迎卡片
                chatArea.innerHTML = `
                    <div class="welcome-card">
                        <h2>👋 哈喽！我是小明天</h2>
                        <p>我是马天明的AI分身，对他的了解可能比他自己还深（笑）<br>
                        今天我的任务就是让面试官你快速认识一个真实、立体的马天明<br>
                        有任何想了解的，尽管问我！</p>
                        <div class="info-badges">
                            <span class="info-badge">📚 湖南师大硕士</span>
                            <span class="info-badge">🤖 AI Agent方向</span>
                            <span class="info-badge">🏀 长沙本地人</span>
                            <span class="info-badge">💻 全栈开发</span>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error clearing chat:', error);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 页面加载时聚焦输入框
        window.onload = function() {
            userInput.focus();
        };
    </script>
</body>
</html>
