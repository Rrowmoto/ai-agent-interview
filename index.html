        const API_BASE_URL = "https://tokenrhythm.studio/v1";
        const API_KEY = "sk_tr_0iPwfmIhkm8c9n3cwAmFHfVbDquBL7_9v3iY96hMuSs";

        const typingIndicator = document.getElementById('typingIndicator');

        function addMessage(content, isUser, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            messageDiv.innerHTML = `
                <div class="message-avatar">${isUser ? '👤' : '🤖'}</div>
                <div class="message-content ${isError ? 'error-message' : ''}">${content}</div>
            `;
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showTyping() {
            typingIndicator.classList.add('active');
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.classList.remove('active');
        }

        function askQuestion(question) {
            userInput.value = question;
            sendMessage();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';
            showTyping();

            // 构建消息列表
            const messages = [{"role": "system", "content": SYSTEM_PROMPT}];
            conversationHistory.slice(-10).forEach(msg => messages.push(msg));
            messages.push({"role": "user", "content": message});

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 25000);

                const response = await fetch(`${API_BASE_URL}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: MODEL_ID,
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 1000
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                hideTyping();

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                }

                const data = await response.json();
                const assistantMessage = data.choices[0].message.content;

                // 更新历史
                conversationHistory.push({"role": "user", "content": message});
                conversationHistory.push({"role": "assistant", "content": assistantMessage});

                addMessage(assistantMessage, false);
            } catch (error) {
                hideTyping();
                if (error.name === 'AbortError') {
                    addMessage('抱歉，响应超时了，请再试一次~', false, true);
                } else if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    addMessage('网络连接有点问题，请检查网络后刷新页面再试~', false, true);
                } else {
                    addMessage(`抱歉，我这边出了点问题：${error.message}，请稍后再试~`, false, true);
                }
                console.error('Error:', error);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 页面加载时聚焦输入框
        window.onload = function() {
            userInput.focus();
        };
    </script>
</body>
</html>
